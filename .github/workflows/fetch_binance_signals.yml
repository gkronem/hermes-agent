name: Futures Signal Scanner (Binance / Bybit / OKX)

on:
  push:
    branches:
      - "claude/binance-futures-signals-9uNJD"
    paths-ignore:
      - "binance_data/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binance-futures-signals-9uNJD
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Create output directory
        run: mkdir -p binance_data

      # || true garante que o step nao falha mesmo quando exchanges sao bloqueadas
      - name: Run signal scanner (auto-detect exchange)
        run: |
          set +e
          python binance_futures_signals.py --top 20 --interval 1h > binance_data/latest_signals.txt 2>&1
          echo "exit_code=$?" >> binance_data/latest_signals.txt

      - name: Test exchange connectivity
        run: |
          {
            echo "=== Connectivity test ==="
            for url in \
              "https://fapi.binance.com/fapi/v1/ping" \
              "https://api.bybit.com/v5/market/time" \
              "https://www.okx.com/api/v5/public/time"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" 2>/dev/null || echo "000")
              echo "$code  $url"
            done
          } >> binance_data/latest_signals.txt

      - name: Save timestamp
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > binance_data/last_updated.txt

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/binance-futures-signals-9uNJD
          git add binance_data/
          git diff --staged --quiet && echo "Sem mudancas" || {
            git commit -m "data: update futures signals [skip ci]"
            git push
          }
